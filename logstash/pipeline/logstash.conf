input {
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["firefox-build-logs"]
    group_id => "logstash-consumer-group"
    consumer_threads => 3
    codec => "plain"
    auto_offset_reset => "earliest"
    decorate_events => true
  }
}

filter {
  # Extract metadata from Kafka headers
  if [@metadata][kafka][headers][filename] {
    mutate {
      add_field => {
        "filename" => "%{[@metadata][kafka][headers][filename]}"
        "line_number" => "%{[@metadata][kafka][headers][line_number]}"
      }
    }
  }

  # Extract build_id from filename
  if [filename] {
    grok {
      match => {
        "filename" => "%{NUMBER:build_id}_%{GREEDYDATA}"
      }
    }
  }

  # Parse log line - timestamp and level
  grok {
    match => {
      "message" => [
        "%{TIME:log_time}%{SPACE}+%{LOGLEVEL:log_level}%{SPACE}+-%{SPACE}+%{GREEDYDATA:log_message}",
        "^%{GREEDYDATA:log_message}$"
      ]
    }
  }

  # TEST events
  if [log_message] =~ /^TEST-/ {
    grok {
      match => {
        "log_message" => [
          "TEST-START .* %{GREEDYDATA:test_name}",
          "TEST-PASS .* %{GREEDYDATA:test_name} .* took %{NUMBER:test_duration:int}ms",
          "TEST-SKIP .* %{GREEDYDATA:test_name} .* took %{NUMBER:test_duration:int}ms",
          "TEST-UNEXPECTED-FAIL .* %{GREEDYDATA:test_name}",
          "TEST-OK .* %{GREEDYDATA:test_name} .* took %{NUMBER:test_duration:int}ms"
        ]
      }
      add_tag => ["test_event"]
    }
    
    if [log_message] =~ /TEST-UNEXPECTED-FAIL/ {
      mutate { 
        add_field => { "test_status" => "failed" }
        add_tag => ["anomaly", "test_failure"]
      }
    } else if [log_message] =~ /TEST-PASS/ {
      mutate { add_field => { "test_status" => "passed" } }
    } else if [log_message] =~ /TEST-SKIP/ {
      mutate { add_field => { "test_status" => "skipped" } }
    }
  }

  # WARNING patterns
  if [log_message] =~ /WARNING/ {
    mutate { add_tag => ["warning"] }
    
    if [log_message] =~ /NS_ENSURE_SUCCESS|failed with result/ {
      mutate { 
        add_field => { "warning_severity" => "high" }
        add_tag => ["anomaly", "critical_warning"]
      }
    }
  }

  # ERROR patterns
  if [log_message] =~ /ERROR|Exception/ {
    mutate { 
      add_tag => ["error", "anomaly"]
      add_field => { "severity" => "critical" }
    }
  }

  # Slow tests
  if [test_duration] {
    if [test_duration] > 60000 {
      mutate { add_tag => ["slow_test", "anomaly"] }
    }
  }

  # Mark anomalies
  if "anomaly" in [tags] {
    mutate { add_field => { "is_anomaly" => true } }
  } else {
    mutate { add_field => { "is_anomaly" => false } }
  }

  # Parse timestamp
  if [log_time] {
    date {
      match => [ "log_time", "HH:mm:ss" ]
      target => "@timestamp"
      timezone => "UTC"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "firefox-logs-%{+YYYY.MM.dd}"
  }

  if "anomaly" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "firefox-anomalies-%{+YYYY.MM.dd}"
    }
  }

  stdout {
    codec => rubydebug
  }
}
